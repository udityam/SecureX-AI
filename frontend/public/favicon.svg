<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 40" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Soft glow behind shield -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield fill (semi-transparent blue wash) -->
  <path
    d="M18 2L4 8v11c0 9.5 6 18 14 20C26 37 32 28.5 32 19V8L18 2Z"
    fill="url(#g1)"
    opacity="0.18"
  />

  <!-- Shield outline -->
  <path
    d="M18 2L4 8v11c0 9.5 6 18 14 20C26 37 32 28.5 32 19V8L18 2Z"
    stroke="url(#g1)"
    stroke-width="1.8"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- X mark centred in shield -->
  <path
    d="M13 15l10 10M23 15L13 25"
    stroke="url(#g1)"
    stroke-width="2.4"
    stroke-linecap="round"
    filter="url(#glow)"
  />
</svg>
